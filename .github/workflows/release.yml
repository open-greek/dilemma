name: Release

on:
  push:
    # Numeric tags are created by scripts/release.py after main CI succeeds.
    # Legacy v-prefixed tags remain accepted for old release lines.
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  verify-main-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful main CI for the tagged commit
        uses: actions/github-script@v9
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: "push",
              head_sha: context.sha,
              status: "success",
              per_page: 100,
            });
            const run = response.data.workflow_runs.find(
              candidate => candidate.path === ".github/workflows/test.yml"
            );
            if (!run) {
              core.setFailed(
                `No successful Tests workflow found for tagged SHA ${context.sha}. ` +
                "Create releases with scripts/release.py."
              );
              return;
            }
            core.info(`Verified Tests workflow: ${run.html_url}`);

  release:
    needs: verify-main-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # Auto-publish dilemma-nlp to PyPI via Trusted Publishing (OIDC; no token).
  publish:
    needs: verify-main-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
