name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable from release.yml so tag-fired releases run the exact same
  # test job that gates main, preventing dep drift between the two.
  workflow_call:

jobs:
  package-smoke:
    name: Wheel smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel
        run: |
          python -m pip install -q --upgrade pip build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import dilemma; assert dilemma.__version__ != '0.0.0+unknown'"
          dilemma --help

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q pytest huggingface_hub betacode pygtrie lxml
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers

      # The data artifacts live on the Hub, not in git, so a push that lands
      # before `hf upload` finishes would otherwise test new code against the
      # previous artifacts. data/hf_manifest.json pins their sha256; wait for
      # the Hub to serve those bytes, then check what actually arrived.
      - name: Wait for the HuggingFace artifacts in data/hf_manifest.json
        run: python3 scripts/hf_data.py wait --timeout 900

      - name: Download lookup data from HuggingFace Hub
        run: hf download ciscoriordan/dilemma $(python3 scripts/hf_data.py files) --local-dir .

      - name: Verify the downloaded artifacts against the manifest
        run: python3 scripts/hf_data.py verify

      - name: Run all tests
        run: python3 -m pytest tests/ -x -v
