[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Import package stays `dilemma`; the PyPI distribution name is dilemma-nlp
# because plain "dilemma" is taken by an unrelated project.
name = "dilemma-nlp"
version = "1.3.6"
description = "Diachronic Greek lemmatizer (Ancient, Byzantine, and Modern Greek)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Francisco Riordan" }]
keywords = ["greek", "ancient-greek", "lemmatization", "nlp", "morphology", "byzantine", "modern-greek"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Greek",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.15", "numpy>=1.24"]
torch = ["torch>=2.0", "numpy>=1.24"]
lm = ["betacode", "pygtrie", "lxml"]  # betacode.conv needs pygtrie but under-declares it; lxml for TEI loci
dev = ["pytest>=7", "spylls>=0.1"]
glossapi-audit = ["pyarrow>=18"]
# The GlossAPI variety classifier is evaluated by an external script only.
# It is deliberately not part of Dilemma's core or tagger runtime.
variety-eval = ["torch>=2.0", "transformers>=4.35"]
# Tagger (full): the torch-free runtime ([tagger-onnx]: onnxruntime + tokenizers)
# PLUS torch + transformers for (re)training and ONNX export. Opt-in; users who
# only want the lemmatizer can skip it. For inference only, prefer [tagger-onnx].
tagger = ["dilemma-nlp[tagger-onnx]", "torch>=2.5", "transformers"]
# Lightweight Ancient-Greek tagger: the GreBerta morphology backend runs on
# onnxruntime + tokenizers only (no torch/transformers). Enough for
# `Tagger(lang="grc")` accent-preserving UPOS + feature tagging.
tagger-onnx = ["onnxruntime>=1.15", "tokenizers>=0.15", "numpy>=1.24",
               "huggingface_hub>=0.20"]

[project.urls]
Homepage = "https://github.com/open-greek/dilemma"
Repository = "https://github.com/open-greek/dilemma"

[project.scripts]
dilemma = "dilemma.__main__:main"

[tool.setuptools]
packages = ["dilemma", "dilemma.tagger"]

[tool.setuptools.package-data]
dilemma = []

[tool.pytest.ini_options]
markers = [
    "slow: tests requiring model weights (skip by default, run with --run-slow)",
]
